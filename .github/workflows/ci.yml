name: CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint PHP files
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            php -d error_reporting=-1 -l "$file" > /dev/null || failed=1
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -print0)
          exit $failed

  phpcs:
    name: Coding standards (WPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs --report=full --report-checkstyle=./phpcs-report.xml
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: phpcs-report.xml

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release folder
        run: |
          mkdir -p build/webcodingplace-post-carousel-for-elementor
          rsync -a --exclude-from=.distignore ./ build/webcodingplace-post-carousel-for-elementor/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/webcodingplace-post-carousel-for-elementor
